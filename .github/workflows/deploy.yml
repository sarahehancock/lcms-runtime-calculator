name: Deploy Shinylive app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::bslib

      - name: Export app with Shinylive
        run: Rscript -e 'shinylive::export("app", "site")'

      # Visitor analytics (GoatCounter: free, no cookies, no consent banner).
      # Replace YOURCODE with the code you chose when signing up at goatcounter.com.
      - name: Add GoatCounter analytics
        env:
          GOATCOUNTER_CODE: sarahehancock
        run: |
          sed -i "s#</head>#<script data-goatcounter=\"https://${GOATCOUNTER_CODE}.goatcounter.com/count\" async src=\"//gc.zgo.at/count.js\"></script></head>#" site/index.html
          grep -q goatcounter site/index.html && echo "GoatCounter added"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
